# The famous plots in the paper style (the README gallery): plotipus run famous.
# Same data, commands and plugins as ../; the style adds paper.json on top.
[project]
data_root = "../input/data"
plots = "../input/plots"
output = "output"
style = ["../style.json", "paper.json"]
python_path = [".."]
plugins = ["models", "annotations"]

[settings]
text_scale = 0.75
