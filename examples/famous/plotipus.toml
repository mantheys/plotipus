# Famous-plot reproductions: run `python make_data.py` once, then
# `plotipus run famous`. models.py registers the fit models of the stored
# fits; annotations.py adds --text (labels drawn by a figure hook).
[project]
data_root = "input/data"
plots = "input/plots"
output = "output"
style = ["style.json"]
python_path = ["."]
plugins = ["models", "annotations", "colorscale"]
